<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Les P'tits Chimistes — Guides Animateur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap">
<style>
:root{
  --paper:#FFF9F7; --paper-alt:#FBE9EE; --ink:#2B1017; --ink-soft:#6E4552; --ink-faint:#A98995;
  --brand:#A30E44; --brand-ink:#FFF3F6; --brand-soft:#F6D3DE;
  --good:#2F7D52; --good-bg:#E3F1E7; --line:#F0D5DD; --card:#FFFFFF;
  --shadow:0 1px 2px rgba(43,16,23,.05), 0 10px 24px rgba(43,16,23,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B1114; --paper-alt:#241419; --ink:#F5E7EA; --ink-soft:#CBAAB4; --ink-faint:#87707A;
    --brand:#F2839E; --brand-ink:#2B0E16; --brand-soft:#3B1B24;
    --good:#79CB9C; --good-bg:#173423; --line:#3A2429; --card:#221519;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --paper:#1B1114; --paper-alt:#241419; --ink:#F5E7EA; --ink-soft:#CBAAB4; --ink-faint:#87707A;
  --brand:#F2839E; --brand-ink:#2B0E16; --brand-soft:#3B1B24;
  --good:#79CB9C; --good-bg:#173423; --line:#3A2429; --card:#221519;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Nunito',Arial,sans-serif;}
h1,h2{font-family:'Baloo 2',Georgia,serif;margin:0;}
.wrap{max-width:720px;margin:0 auto;padding:34px 20px 60px;display:flex;flex-direction:column;gap:22px;}

.hero{display:flex;flex-direction:column;gap:8px;}
.hero .eyebrow{font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--brand);}
.hero h1{font-size:clamp(26px,5vw,36px);font-weight:800;color:var(--ink);}
.hero p{margin:0;font-size:14.5px;color:var(--ink-soft);font-weight:600;max-width:56ch;}

.list{display:flex;flex-direction:column;gap:14px;}
.card{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);transition:transform .12s;}
.card:hover{transform:translateY(-2px);}
.cardmain{flex:1;min-width:0;display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;}
.card .num{flex:none;width:46px;height:46px;border-radius:13px;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',serif;font-weight:700;font-size:19px;}
.card .num.soon{background:var(--paper-alt);color:var(--ink-faint);}
.card .body{flex:1;min-width:0;}
.card .body h2{font-size:16.5px;font-weight:700;}
.card .body p{margin:2px 0 0;font-size:12.5px;color:var(--ink-soft);font-weight:600;}
.card .tag{flex:none;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:5px 10px;border-radius:999px;background:var(--good-bg);color:var(--good);}
.card .tag.soon{background:var(--paper-alt);color:var(--ink-faint);}
.card .arrow{flex:none;font-size:18px;color:var(--brand);}
.card.disabled{cursor:default;opacity:.65;}
.card.disabled:hover{transform:none;}
.filebtn{flex:none;display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--paper-alt);color:var(--brand);text-decoration:none;font-size:16px;}
.filebtn:hover{border-color:var(--brand);}

footer{text-align:center;font-size:11.5px;color:var(--ink-faint);font-weight:700;letter-spacing:.3px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="eyebrow">Le Kompa · Les P'tits Chimistes</div>
    <h1>Guides animateur</h1>
    <p>Un guide interactif par séance : étapes, minuteurs, votes et quiz — l'intervenant supervise, l'écran mène la séance. Cliquez sur une séance pour l'ouvrir.</p>
  </div>

  <div class="list" id="list"></div>
  <footer>LE KOMPA · Les P'tits Chimistes</footer>
</div>

<script>
  // Pour ajouter une nouvelle séance : ajouter une ligne ici, puis créer le
  // fichier seanceN.html à côté de celui-ci (copier un guide existant comme base).
  const SEANCES = [
    { n:1, titre:"Le Volcan en Éruption", theme:"Réactions acide-base", file:"seance1.html", fiche:"fiches/Fiche-observation-Seance-1-Volcan.pdf", ready:true },
    { n:2, titre:"Le Papier Recyclé", theme:"Recyclage et fibres", file:"seance2.html", fiche:"fiches/Fiche-observation-Seance-2-Papier.pdf", ready:true },
    { n:3, titre:"Encre Invisible", theme:"Indicateur naturel et révélation", file:"seance3.html", fiche:"fiches/Fiche-observation-Seance-3-Encre.pdf", ready:true },
    { n:4, titre:"Le Lait Magique", theme:"Tension superficielle et mélanges", file:"seance4.html", fiche:null, ready:false },
  ];

  function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  const list = document.getElementById('list');
  list.innerHTML = SEANCES.map(s => {
    const inner = `
      <span class="num${s.ready ? '' : ' soon'}">${s.n}</span>
      <span class="body">
        <h2>${escapeHtml(s.titre)}</h2>
        <p>${escapeHtml(s.theme)}</p>
      </span>
      <span class="tag${s.ready ? '' : ' soon'}">${s.ready ? 'Prêt' : 'À venir'}</span>
      ${s.ready ? '<span class="arrow">▶</span>' : ''}
    `;
    const main = s.ready
      ? `<a class="cardmain" href="${s.file}">${inner}</a>`
      : `<div class="cardmain">${inner}</div>`;
    const fileBtn = s.fiche
      ? `<a class="filebtn" href="${s.fiche}" download title="Télécharger la fiche d'observation">📄</a>`
      : '';
    return `<div class="card${s.ready ? '' : ' disabled'}">${main}${fileBtn}</div>`;
  }).join('');
</script>
</body>
</html>
