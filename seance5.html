<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Guide Animateur — Ça se dissout ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap">
<style>
:root{
  --paper:#FFF9F7; --paper-alt:#FBE9EE; --ink:#2B1017; --ink-soft:#6E4552; --ink-faint:#A98995;
  --brand:#A30E44; --brand-ink:#FFF3F6; --brand-soft:#F6D3DE;
  --good:#2F7D52; --good-bg:#E3F1E7; --warn:#A9670A; --warn-bg:#FAEED2; --bad:#B23B3B; --bad-bg:#FAE5E3;
  --line:#F0D5DD; --card:#FFFFFF;
  --shadow:0 1px 2px rgba(43,16,23,.05), 0 10px 24px rgba(43,16,23,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B1114; --paper-alt:#241419; --ink:#F5E7EA; --ink-soft:#CBAAB4; --ink-faint:#87707A;
    --brand:#F2839E; --brand-ink:#2B0E16; --brand-soft:#3B1B24;
    --good:#79CB9C; --good-bg:#173423; --warn:#E9B75A; --warn-bg:#33260C; --bad:#E48A8A; --bad-bg:#3A1E1E;
    --line:#3A2429; --card:#221519;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --paper:#1B1114; --paper-alt:#241419; --ink:#F5E7EA; --ink-soft:#CBAAB4; --ink-faint:#87707A;
  --brand:#F2839E; --brand-ink:#2B0E16; --brand-soft:#3B1B24;
  --good:#79CB9C; --good-bg:#173423; --warn:#E9B75A; --warn-bg:#33260C; --bad:#E48A8A; --bad-bg:#3A1E1E;
  --line:#3A2429; --card:#221519;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Nunito',Arial,sans-serif;display:flex;flex-direction:column;}
h1,h2,h3{font-family:'Baloo 2',Georgia,serif;margin:0;}

header{flex:none;display:flex;flex-direction:column;gap:8px;padding:14px 18px calc(10px + env(safe-area-inset-top,0px)) 18px;background:var(--brand);color:var(--brand-ink);}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.hbrand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.6px;opacity:.92;}
.hstep{font-weight:700;font-size:13px;opacity:.92;}
.progress{height:6px;border-radius:4px;background:rgba(255,255,255,.28);overflow:hidden;}
.progress > i{display:block;height:100%;background:#fff;border-radius:4px;transition:width .35s ease;}

main{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:22px 18px 28px;}
.stage{width:100%;max-width:640px;display:flex;flex-direction:column;gap:16px;}

.stepicon{font-size:44px;text-align:center;}
.steptitle{font-size:clamp(22px,4vw,30px);font-weight:800;color:var(--brand);text-align:center;text-wrap:balance;}
.stepsub{font-size:14px;color:var(--ink-soft);text-align:center;font-weight:600;}

.say{background:var(--paper-alt);border-left:5px solid var(--brand);border-radius:0 12px 12px 0;padding:14px 16px;font-size:15.5px;font-weight:700;line-height:1.45;font-style:italic;color:var(--ink);}
.say .lbl{display:block;font-style:normal;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--brand);margin-bottom:5px;}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);}
.card h3{font-size:13px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px;}

.checklist{display:flex;flex-direction:column;gap:2px;}
.citem{display:flex;align-items:center;gap:10px;padding:9px 4px;border-radius:9px;cursor:pointer;font-weight:700;font-size:14.5px;}
.citem:hover{background:var(--paper-alt);}
.citem .box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;transition:background .15s,border-color .15s;}
.citem.done .box{background:var(--good);border-color:var(--good);color:#fff;}
.citem.done span.txt{color:var(--ink-faint);text-decoration:line-through;}

.timerbox{display:flex;flex-direction:column;align-items:center;gap:12px;}
.timerbig{font-family:'Baloo 2',serif;font-weight:700;font-size:clamp(44px,12vw,64px);color:var(--brand);font-variant-numeric:tabular-nums;}
.timerbtns{display:flex;gap:10px;}

.quizq{font-size:16px;font-weight:800;text-align:center;margin-bottom:4px;}
.quizopts{display:flex;flex-direction:column;gap:10px;}
.qopt{font-family:inherit;font-weight:700;font-size:14.5px;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:13px 16px;cursor:pointer;transition:transform .08s, border-color .15s, background .15s;}
.qopt:hover{transform:translateY(-1px);}
.qopt.correct{background:var(--good-bg);border-color:var(--good);}
.qopt.wrong{background:var(--bad-bg);border-color:var(--bad);}
.qopt:disabled{cursor:default;}
.qexplain{font-size:13.5px;font-weight:600;color:var(--ink-soft);background:var(--paper-alt);border-radius:10px;padding:11px 14px;display:none;}
.qexplain.show{display:block;}

.vote{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.vote button{font-family:inherit;font-weight:800;font-size:14px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:11px 20px;cursor:pointer;}
.vote button.picked{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);}

.scoretag{align-self:center;font-family:'Baloo 2',serif;font-weight:700;font-size:18px;color:var(--brand);background:var(--paper-alt);border-radius:999px;padding:8px 18px;}

.vocab{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.vocab span{background:var(--paper-alt);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-weight:700;font-size:12.5px;color:var(--brand);cursor:pointer;}
.vocab span:hover{border-color:var(--brand);}

.popover-backdrop{position:fixed;inset:0;z-index:59;}
.popover{position:fixed;z-index:60;width:260px;max-width:calc(100vw - 32px);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);font-size:13px;font-weight:600;line-height:1.45;color:var(--ink);}
.popover .term{display:block;font-family:'Baloo 2',serif;font-weight:700;color:var(--brand);font-size:14.5px;margin-bottom:4px;}

.memo{border:1.5px dashed var(--line);border-radius:12px;overflow:hidden;background:var(--paper-alt);}
.memo summary{cursor:pointer;padding:12px 14px;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--brand);list-style:none;display:flex;align-items:center;gap:7px;}
.memo summary::-webkit-details-marker{display:none;}
.memo summary::before{content:"▸";font-size:11px;transition:transform .15s;}
.memo[open] summary::before{transform:rotate(90deg);}
.memo .memobody{padding:0 14px 14px;font-size:13px;line-height:1.65;font-weight:600;color:var(--ink-soft);white-space:pre-line;}

.bigbtn{align-self:center;font-family:'Baloo 2',serif;font-weight:700;font-size:16px;border:none;background:var(--brand);color:var(--brand-ink);border-radius:14px;padding:14px 30px;cursor:pointer;box-shadow:var(--shadow);}
.bigbtn:active{transform:translateY(1px);}

.filelink{align-self:center;display:inline-flex;align-items:center;gap:7px;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;color:var(--brand);text-decoration:none;border:2px solid var(--line);border-radius:999px;padding:9px 16px;background:var(--card);}
.filelink:hover{border-color:var(--brand);}

footer{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);}
.navbtn{font-family:'Baloo 2',serif;font-weight:700;font-size:14.5px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 18px;cursor:pointer;}
.navbtn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent;}
.navbtn:disabled{opacity:.4;cursor:not-allowed;}
.dots{display:flex;gap:5px;}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);}
.dots i.on{background:var(--brand);}
[hidden]{display:none!important;}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="hbrand">🧪 Les P'tits Chimistes</div>
    <div class="hstep" id="hStep"></div>
  </div>
  <div class="progress"><i id="progFill"></i></div>
</header>
<main><div class="stage" id="stage"></div></main>
<footer>
  <button class="navbtn" id="prevBtn" type="button">◀ Précédent</button>
  <div class="dots" id="dots"></div>
  <button class="navbtn primary" id="nextBtn" type="button">Suivant ▶</button>
</footer>

<script>
(function(){
  const STEPS = [
    { kind:'title' },
    { kind:'info', icon:'⚠️', title:'Sécurité — à rappeler', say:"On ne goûte jamais nos mélanges, même quand ça ressemble à de l'eau. On remue doucement avec la cuillère, sans éclabousser. Le vinaigre, c'est moi qui le verse.",
      list:["On ne porte jamais un gobelet à la bouche","On remue doucement, le gobelet reste posé sur la table","On lève la main pour recevoir le vinaigre"] },
    { kind:'checklist', icon:'🧰', title:'Matériel à préparer', sub:"Zéro achat : tout vient des séances 1 à 3 !",
      items:[
        "♻️ Gobelets doseurs et cuillères — transparents si possible, pour bien voir",
        "♻️ Bicarbonate de soude et vinaigre blanc",
        "♻️ Colorant alimentaire et liquide vaisselle",
        "♻️ Pâte à modeler",
        "♻️ Curcuma",
        "♻️ Confettis de papier",
        "♻️ Entonnoir(s) + essuie-tout pour le filtre — compter combien on a d'entonnoirs (1 ou 2 ?)",
        "♻️ Une des 3 bouteilles, remplie d'eau du robinet pour servir l'eau",
        "♻️ 1 bac pour vider et rincer les gobelets",
        "♻️ Éponges, torchons, chutes de papier + crayons pour noter les résultats",
        "À l'arrivée : préparer 2 coins de table, un par groupe, avec les 6 produits à tester"
      ],
      memo:"LES 6 PRODUITS À TESTER (par groupe) : une pincée de bicarbonate, quelques gouttes de colorant, une goutte de liquide vaisselle, une pincée de curcuma, une petite boule de pâte à modeler, quelques confettis.\n\nPAS ASSEZ DE GOBELETS ? On teste les produits un par un dans le même gobelet, en le vidant et le rinçant dans le bac entre deux essais.\n\nLa pâte à modeler de la séance 1 a peut-être un peu séché : ce n'est pas grave, pour cette séance elle doit justement… ne pas se dissoudre !" },
    { kind:'info', icon:'👋', title:'Accueil et rappel de la méthode', sub:"0–5 min",
      say:"Bienvenue chimistes ! On se souvient de la règle d'or : je regarde, j'écoute, puis j'expérimente. Aujourd'hui, on devient des détectives : on va chercher des produits qui disparaissent… mais qui sont toujours là ! Et on apprend un nouveau truc de chimiste : ranger ses résultats dans un tableau.",
      list:["Rappeler la règle d'or à voix haute, tous ensemble","Se souvenir du lait magique : on avait mélangé des produits sans en fabriquer un nouveau, et vérifié avec un essai témoin","Nouvelle étape de la méthode : classer ses résultats dans un tableau, pour les comparer avec les autres groupes","Former 2 groupes d'environ 7-8 enfants","Tour de table : « Qu'est-ce qu'on met dans l'eau à la maison ? » (sucre, sirop, sel…)"],
      timer:300 },
    { kind:'vote', icon:'🤔', title:'Le mystère du jour', sub:"5–9 min",
      say:"Je mets une petite cuillère de bicarbonate dans ce gobelet d'eau, et je remue bien. À votre avis, qu'est-ce qui va se passer ?",
      options:["Il va disparaître","Il va rester au fond","Ça va mousser"],
      note:"Il n'y a pas de mauvaise réponse à une hypothèse ! Compte les mains levées et clique sur l'option qui a le plus de votes — on vérifie tout de suite après.",
      memo:"RÉPONSE RÉELLE : il « disparaît » ! En remuant bien, l'eau redevient transparente (parfois un peu trouble au début). Le bicarbonate s'est dissous.\n\nÇa ne mousse pas : pour mousser, il faut un acide comme le vinaigre (séance 1).\n\nSi on met BEAUCOUP de bicarbonate, une partie reste au fond : l'eau ne peut pas en dissoudre autant qu'on veut. Les enfants qui ont voté « il va rester au fond » n'ont donc pas complètement tort !" },
    { kind:'checklist', icon:'🪄', title:'Démonstration guidée', sub:"9–15 min",
      say:"Regardez : le bicarbonate a disparu ! Mais est-ce qu'il est vraiment parti ? Je vais verser un peu de vinaigre dans l'eau… Oh, ça pétille ! Il était donc toujours là, caché dans l'eau.",
      items:["Verser une petite cuillère de bicarbonate dans un gobelet d'eau","Remuer jusqu'à ce que l'eau redevienne transparente","Demander : « Où est passé le bicarbonate ? »","Verser un peu de vinaigre dans le gobelet : ça pétille !","Nommer ce qu'on voit : « il n'a pas disparu, il est dissous ! »","Introduire les mots dissoudre et mélange"],
      memo:"DISSOUDRE = quand un produit se défait dans l'eau en morceaux si petits qu'on ne peut plus les voir. Il est toujours là, mais invisible.\n\nSi un enfant demande « pourquoi ça pétille moins que le volcan ? » : le bicarbonate est dilué dans beaucoup d'eau, et il n'y a pas de liquide vaisselle pour faire de la mousse. Mais c'est la même réaction qu'en séance 1 !\n\nSi un enfant demande « c'est comme l'encre invisible ? » : oui, exactement ! L'encre invisible de la séance 3, c'était du bicarbonate dissous dans l'eau." },
    { kind:'timer', icon:'🕵️', title:'Les détectives du mélange', sub:"15–30 min", seconds:900,
      say:"À vous de jouer, détectives ! Dans chaque groupe, vous allez tester 6 produits dans l'eau. Avant chaque essai, on vote : ça va se dissoudre ou pas ? Puis on vérifie !",
      list:["Chaque groupe a 6 produits : bicarbonate, colorant, liquide vaisselle, curcuma, pâte à modeler, confettis","Un enfant différent verse et remue pour chaque produit","Avant chaque essai : vote à main levée « se dissout / ne se dissout pas »","On note le résultat sur une feuille en 2 colonnes : ✅ se dissout / ❌ ne se dissout pas","L'intervenant passe d'un groupe à l'autre pour relancer les questions"],
      memo:"RÉSULTATS ATTENDUS :\n• Bicarbonate → se dissout (une petite quantité).\n• Colorant → se dissout et colore toute l'eau.\n• Liquide vaisselle → se mélange complètement à l'eau (et fait des bulles si on remue fort).\n• Curcuma → le cas piège ! L'eau devient jaune, mais des petits grains restent au fond : une partie se dissout, le reste forme un dépôt. Parfait pour la discussion.\n• Pâte à modeler → ne se dissout pas : elle reste en boule au fond.\n• Confettis → ne se dissolvent pas : ils flottent, se ramollissent, mais restent en morceaux.\n\nSi un enfant remarque que l'eau des confettis se colore un peu : bien vu ! C'est l'encre des confettis qui se dissout, pas le papier.\n\nSi un enfant demande « et si on attend très longtemps ? » : la pâte à modeler ne se dissoudra jamais dans l'eau, même après des jours." },
    { kind:'timer', icon:'🧻', title:'Peut-on séparer un mélange ?', sub:"30–42 min", seconds:720,
      say:"On prépare une « soupe mystère » : de l'eau, du colorant et des confettis. Est-ce qu'on peut récupérer les confettis ? Et le colorant ? On essaie avec un filtre !",
      list:["Chaque groupe prépare sa soupe mystère : eau + quelques gouttes de colorant + confettis","S'il y a 2 entonnoirs : chaque groupe filtre avec un entonnoir et une feuille d'essuie-tout au-dessus d'un gobelet","S'il n'y a qu'un entonnoir : le groupe 1 prend l'entonnoir, le groupe 2 fait le « filtre à 4 mains » (2 enfants tendent une feuille d'essuie-tout au-dessus d'un gobelet, un 3e verse doucement), puis on échange","Observer : les confettis restent sur le filtre, l'eau qui passe est toujours colorée","Avec le curcuma : le filtre arrête les grains, mais l'eau qui passe reste jaune","Défi bonus : filtrer l'eau au bicarbonate, puis verser du vinaigre dans l'eau filtrée → ça pétille encore !"],
      memo:"1 OU 2 ENTONNOIRS ? Les deux méthodes marchent : le « filtre à 4 mains » montre exactement la même chose que l'entonnoir. Il faut juste bien tendre l'essuie-tout et verser doucement, au centre, pour que rien ne déborde sur les côtés.\n\nCE QU'ON OBSERVE : le filtre arrête les confettis (pas dissous), mais laisse passer le colorant (dissous) avec l'eau.\n\nPOURQUOI ? Les morceaux d'un produit dissous sont tellement petits qu'ils passent par les trous du filtre, comme l'eau. Les confettis sont trop gros : ils restent bloqués.\n\nLe défi bonus montre que le bicarbonate dissous traverse lui aussi le filtre : il est invisible, mais le vinaigre prouve qu'il est là.\n\nSi un enfant demande « alors comment on récupère le colorant ? » : il faudrait faire évaporer l'eau (la laisser sécher très longtemps au soleil ou la chauffer) : le colorant resterait au fond. C'est comme ça qu'on récupère le sel dans les marais salants !" },
    { kind:'info', icon:'🧪', title:'Pourquoi ça marche ?', sub:"42–50 min",
      say:"Quand un produit se dissout, il se défait en morceaux tellement petits qu'on ne les voit plus. Mais il est toujours là, caché dans l'eau ! C'est pour ça qu'il passe à travers le filtre, alors que les confettis restent bloqués.",
      list:["Mettre en commun les tableaux des 2 groupes : est-ce qu'on a trouvé les mêmes résultats ?","Redire les mots dissoudre, mélange et filtre","Mélange ou réaction chimique ? Bicarbonate + eau = mélange (il se dissout, rien de nouveau n'apparaît). Bicarbonate + vinaigre = réaction chimique (du gaz apparaît, comme dans le volcan !)","Faire le lien avec la séance 3 : notre encre invisible, c'était du bicarbonate dissous !"],
      timer:480,
      memo:"RÉCAP : certains produits sont solubles (ils se dissolvent dans l'eau : bicarbonate, colorant), d'autres non (pâte à modeler, papier). Un produit dissous est invisible mais toujours présent. Un filtre sépare ce qui n'est pas dissous, mais pas ce qui est dissous.\n\nMÉLANGE OU RÉACTION ? C'est le fil rouge de toutes les séances. Dans un mélange, les produits sont toujours là, même invisibles (on peut parfois les séparer : filtre, évaporation). Dans une réaction chimique, un nouveau produit apparaît (gaz du volcan, couleur de l'encre) et on ne peut pas revenir en arrière.\n\nPour les plus grands : un mélange où on ne voit plus qu'une seule chose (eau + colorant) s'appelle une solution." },
    { kind:'quiz', icon:'🎓', title:'Quiz des détectives', sub:"50–56 min · si le temps manque, on le fera la semaine prochaine",
      questions:[
        { q:"Quand le bicarbonate « disparaît » dans l'eau, il…", options:["S'est envolé","Est toujours là, mais dissous","S'est transformé en eau"], correct:1, explain:"Il est en morceaux trop petits pour être vus, mais il est toujours là : la preuve, le vinaigre le fait encore pétiller !" },
        { q:"Lequel de ces produits ne se dissout PAS dans l'eau ?", options:["Le colorant","Le bicarbonate","La pâte à modeler"], correct:2, explain:"La pâte à modeler reste en boule au fond, même si on remue très longtemps." },
        { q:"Après le filtre, l'eau est encore colorée. Pourquoi ?", options:["Le filtre est cassé","Le colorant est dissous : il passe avec l'eau","Les confettis ont fondu"], correct:1, explain:"Le colorant dissous est en tout petits morceaux qui passent à travers le filtre, comme l'eau. Les confettis, eux, restent bloqués." }
      ] },
    { kind:'info', icon:'💬', title:'Débrief et rangement', sub:"56–60 min",
      say:"Est-ce qu'un produit qui disparaît dans l'eau est vraiment parti ? … Non ! Il est dissous : invisible, mais toujours là. Et avec un filtre, on peut séparer ce qui n'est pas dissous.",
      list:["Reprendre le vocabulaire du jour ensemble","Demander à 2-3 enfants d'expliquer avec leurs mots","Ranger : vider les gobelets dans le bac, récupérer la pâte à modeler et la laisser sécher (elle resservira en séance 6 !), essuyer les tables"],
      timer:240,
      memo:"RÉCAP si besoin : le bicarbonate et le colorant se dissolvent dans l'eau, la pâte à modeler et les confettis non. Un produit dissous est invisible mais toujours là. Le filtre arrête les morceaux, pas ce qui est dissous." },
    { kind:'vocabend', icon:'✅', title:'Séance terminée, bravo !' },
    { kind:'end', icon:'⛵', title:'La semaine prochaine', teaser:"Flotte ou coule ? — on construit des bateaux en pâte à modeler et on organise un grand concours de cargos !" }
  ];

  const STORAGE_KEY = 'dissoutGuideStep';
  let idx = 0;
  try{ const s = parseInt(localStorage.getItem(STORAGE_KEY)||'',10); if(!isNaN(s) && s>=0 && s<STEPS.length) idx = s; }catch(e){}

  let voteCounts = {};
  let quizState = STEPS.find(s=>s.kind==='quiz') ? STEPS.find(s=>s.kind==='quiz').questions.map(()=>null) : [];
  const checklistState = {};
  let AC = null;
  function beep(){
    try{
      AC = AC || new (window.AudioContext||window.webkitAudioContext)();
      [0,0.18].forEach((d,i)=>{
        const o=AC.createOscillator(), g=AC.createGain();
        o.type='triangle'; o.frequency.value = i===0?880:1180;
        const t=AC.currentTime+d;
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.18,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
        o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+0.32);
      });
    }catch(e){}
  }

  function saveStep(){ try{ localStorage.setItem(STORAGE_KEY, String(idx)); }catch(e){} }

  function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  const DEFINITIONS = {
    "Mélange":"Quand on met plusieurs produits ensemble. Parfois, on peut les séparer à nouveau, par exemple avec un filtre.",
    "Dissoudre":"Quand un produit se défait dans l'eau en morceaux si petits qu'on ne les voit plus — mais il est toujours là !",
    "Soluble":"Se dit d'un produit qui peut se dissoudre dans l'eau, comme le bicarbonate ou le colorant.",
    "Filtre":"Ce qui retient les morceaux et laisse passer l'eau — ici, l'essuie-tout.",
    "Hypothèse":"Une idée qu'on propose avant de vérifier par l'expérience.",
    "Dépôt":"Ce qui reste au fond du gobelet quand un produit ne se dissout pas, ou quand on en a mis trop."
  };
  function closePopover(){
    if(window._pop){ window._pop.backdrop.remove(); window._pop.pop.remove(); window._pop=null; }
  }
  function showPopover(anchor, term, def){
    closePopover();
    const backdrop = document.createElement('div');
    backdrop.className = 'popover-backdrop';
    backdrop.addEventListener('click', closePopover);
    const pop = document.createElement('div');
    pop.className = 'popover';
    pop.innerHTML = `<span class="term">${escapeHtml(term)}</span>${escapeHtml(def)}`;
    document.body.appendChild(backdrop);
    document.body.appendChild(pop);
    const r = anchor.getBoundingClientRect();
    const pw = 260;
    let left = Math.min(Math.max(16, r.left), window.innerWidth - pw - 16);
    let top = r.bottom + 8;
    if(top + 90 > window.innerHeight) top = Math.max(16, r.top - 90);
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
    window._pop = {backdrop, pop};
  }
  function wireVocab(container){
    container.querySelectorAll('.vocab span').forEach(el => {
      el.addEventListener('click', (ev) => {
        ev.stopPropagation();
        const term = el.textContent;
        const def = DEFINITIONS[term];
        if(def) showPopover(el, term, def);
      });
    });
  }

  function renderMemo(step){
    if(!step.memo) return '';
    return `<details class="memo"><summary>🧠 Mémo tuteur — pour répondre aux questions</summary><div class="memobody">${escapeHtml(step.memo)}</div></details>`;
  }

  function renderSayAndList(step){
    let html = '';
    if(step.say) html += `<div class="say"><span class="lbl">🗣️ À dire aux enfants</span>${escapeHtml(step.say)}</div>`;
    if(step.list) html += `<div class="card"><h3>Consignes</h3><ul style="margin:0;padding-left:18px;font-size:14px;line-height:1.7;font-weight:600;">${step.list.map(l=>`<li>${escapeHtml(l)}</li>`).join('')}</ul></div>`;
    return html;
  }

  let timerHandle = null, timerLeft = 0, timerRunning = false;
  function stopTimer(){ if(timerHandle){ clearInterval(timerHandle); timerHandle=null; } timerRunning=false; }
  function formatT(s){ const m=Math.floor(s/60), r=s%60; return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0'); }

  function renderTimerBlock(seconds){
    timerLeft = seconds;
    return `<div class="card timerbox">
      <h3>Minuteur</h3>
      <div class="timerbig" id="timerDisp">${formatT(timerLeft)}</div>
      <div class="timerbtns">
        <button class="navbtn primary" id="timerStart" type="button">▶ Démarrer</button>
        <button class="navbtn" id="timerReset" type="button">↺ Réinitialiser</button>
      </div>
    </div>`;
  }
  function wireTimer(seconds){
    const disp = document.getElementById('timerDisp');
    const startBtn = document.getElementById('timerStart');
    const resetBtn = document.getElementById('timerReset');
    if(!disp) return;
    stopTimer();
    timerLeft = seconds;
    disp.textContent = formatT(timerLeft);
    startBtn.addEventListener('click', () => {
      if(timerRunning){ stopTimer(); startBtn.textContent = '▶ Démarrer'; return; }
      timerRunning = true; startBtn.textContent = '⏸ Pause';
      timerHandle = setInterval(() => {
        timerLeft--;
        if(timerLeft <= 0){ timerLeft = 0; disp.textContent = formatT(0); stopTimer(); startBtn.textContent = '▶ Démarrer'; beep(); return; }
        disp.textContent = formatT(timerLeft);
      }, 1000);
    });
    resetBtn.addEventListener('click', () => {
      stopTimer(); timerLeft = seconds; disp.textContent = formatT(timerLeft); startBtn.textContent = '▶ Démarrer';
    });
  }

  function render(){
    const step = STEPS[idx];
    document.getElementById('hStep').textContent = `Étape ${idx+1} / ${STEPS.length}`;
    document.getElementById('progFill').style.width = Math.round((idx)/(STEPS.length-1)*100) + '%';
    const dots = document.getElementById('dots');
    dots.innerHTML = STEPS.map((_,i)=>`<i class="${i===idx?'on':''}"></i>`).join('');
    document.getElementById('prevBtn').disabled = idx === 0;
    const nextBtn = document.getElementById('nextBtn');
    nextBtn.disabled = false;
    nextBtn.textContent = idx === STEPS.length-1 ? 'Terminer ✓' : 'Suivant ▶';

    const stage = document.getElementById('stage');
    let html = '';

    if(step.kind === 'title'){
      html = `
        <div class="stepicon">🥄</div>
        <div class="steptitle">Ça se dissout ?</div>
        <div class="stepsub">Séance 5 · Les P'tits Chimistes · groupe de 15 (CP→CM2) · 60 minutes</div>
        <div class="card"><h3>Objectif de la séance</h3>
          <p style="margin:0;font-size:14.5px;font-weight:600;line-height:1.5;">Découvrir que certains produits se dissolvent dans l'eau et d'autres non, prouver qu'un produit dissous est toujours là, et apprendre à séparer un mélange avec un filtre !</p>
        </div>
        <div class="say" style="border-color:var(--good);"><span class="lbl" style="color:var(--good);">♻️ Zéro achat</span>Cette séance n'utilise que du matériel déjà en stock : bicarbonate, vinaigre, colorant, gobelets, entonnoir, essuie-tout, confettis et pâte à modeler des séances précédentes.</div>
        <div class="vocab"><span>Mélange</span><span>Dissoudre</span><span>Soluble</span><span>Filtre</span><span>Hypothèse</span></div>
        <a class="filelink" href="fiches/Fiche-observation-Seance-5-Dissolution.pdf" download>📄 Télécharger la fiche d'observation (PDF)</a>
        <button class="bigbtn" id="startBtn" type="button">C'est parti ▶</button>
      `;
    } else if(step.kind === 'info'){
      html = `
        <div class="stepicon">${step.icon}</div>
        <div class="steptitle">${escapeHtml(step.title)}</div>
        ${step.sub ? `<div class="stepsub">${escapeHtml(step.sub)}</div>` : ''}
        ${renderSayAndList(step)}
        ${step.timer ? renderTimerBlock(step.timer) : ''}
        ${renderMemo(step)}
      `;
    } else if(step.kind === 'checklist'){
      html = `
        <div class="stepicon">${step.icon}</div>
        <div class="steptitle">${escapeHtml(step.title)}</div>
        ${step.sub ? `<div class="stepsub">${escapeHtml(step.sub)}</div>` : ''}
        ${step.say ? `<div class="say"><span class="lbl">🗣️ À dire aux enfants</span>${escapeHtml(step.say)}</div>` : ''}
        <div class="card"><h3>À cocher au fur et à mesure</h3>
          <div class="checklist">
            ${step.items.map((it,i)=>{
              const key = idx+'-'+i;
              const done = !!checklistState[key];
              return `<div class="citem ${done?'done':''}" data-key="${key}"><span class="box">${done?'✓':''}</span><span class="txt">${escapeHtml(it)}</span></div>`;
            }).join('')}
          </div>
        </div>
        ${renderMemo(step)}
      `;
    } else if(step.kind === 'vote'){
      const picked = voteCounts[idx];
      html = `
        <div class="stepicon">${step.icon}</div>
        <div class="steptitle">${escapeHtml(step.title)}</div>
        ${step.sub ? `<div class="stepsub">${escapeHtml(step.sub)}</div>` : ''}
        <div class="say"><span class="lbl">🗣️ À dire aux enfants</span>${escapeHtml(step.say)}</div>
        <div class="card">
          <h3>Vote à main levée</h3>
          <div class="vote">
            ${step.options.map((o,i)=>`<button type="button" data-vote="${i}" class="${picked===i?'picked':''}">${escapeHtml(o)}</button>`).join('')}
          </div>
        </div>
        ${step.note ? `<div class="say" style="border-color:var(--good);"><span class="lbl" style="color:var(--good);">💡 Astuce</span>${escapeHtml(step.note)}</div>` : ''}
        ${renderMemo(step)}
      `;
    } else if(step.kind === 'timer'){
      html = `
        <div class="stepicon">${step.icon}</div>
        <div class="steptitle">${escapeHtml(step.title)}</div>
        ${step.sub ? `<div class="stepsub">${escapeHtml(step.sub)}</div>` : ''}
        ${renderSayAndList(step)}
        ${renderTimerBlock(step.seconds)}
        ${renderMemo(step)}
      `;
    } else if(step.kind === 'quiz'){
      html = `
        <div class="stepicon">${step.icon}</div>
        <div class="steptitle">${escapeHtml(step.title)}</div>
        ${step.sub ? `<div class="stepsub">${escapeHtml(step.sub)}</div>` : ''}
        <div class="scoretag" id="scoreTag"></div>
        <div id="quizList" style="display:flex;flex-direction:column;gap:18px;"></div>
      `;
    } else if(step.kind === 'vocabend'){
      html = `
        <div class="stepicon">${step.icon}</div>
        <div class="steptitle">${escapeHtml(step.title)}</div>
        <div class="stepsub">Vous êtes maintenant de vrais détectives des mélanges !</div>
        <div class="vocab"><span>Mélange</span><span>Dissoudre</span><span>Soluble</span><span>Filtre</span><span>Hypothèse</span><span>Dépôt</span></div>
      `;
    } else if(step.kind === 'end'){
      html = `
        <div class="stepicon">${step.icon}</div>
        <div class="steptitle">${escapeHtml(step.title)}</div>
        <div class="card"><p style="margin:0;font-size:15px;font-weight:700;text-align:center;">${escapeHtml(step.teaser)}</p></div>
      `;
    }

    stage.innerHTML = html;

    if(step.kind === 'title'){
      document.getElementById('startBtn').addEventListener('click', () => go(idx+1));
    }
    if(step.kind === 'checklist'){
      stage.querySelectorAll('.citem').forEach(el => {
        el.addEventListener('click', () => {
          const key = el.dataset.key;
          checklistState[key] = !checklistState[key];
          el.classList.toggle('done', !!checklistState[key]);
          el.querySelector('.box').textContent = checklistState[key] ? '✓' : '';
        });
      });
    }
    if(step.kind === 'vote'){
      stage.querySelectorAll('[data-vote]').forEach(btn => {
        btn.addEventListener('click', () => {
          voteCounts[idx] = parseInt(btn.dataset.vote,10);
          stage.querySelectorAll('[data-vote]').forEach(b => b.classList.toggle('picked', b===btn));
        });
      });
    }
    if((step.kind === 'info' && step.timer) || step.kind === 'timer'){
      wireTimer(step.kind==='timer' ? step.seconds : step.timer);
    }
    if(step.kind === 'quiz'){
      renderQuiz(step);
    }
    wireVocab(stage);

    saveStep();
  }

  function renderQuiz(step){
    const list = document.getElementById('quizList');
    function updateScore(){
      const answered = quizState.filter(v=>v!==null).length;
      const correct = quizState.filter((v,i)=>v===step.questions[i].correct).length;
      document.getElementById('scoreTag').textContent = `Score : ${correct} / ${answered || step.questions.length} bonnes réponses`;
    }
    list.innerHTML = step.questions.map((q,qi) => `
      <div class="card">
        <div class="quizq">${qi+1}. ${escapeHtml(q.q)}</div>
        <div class="quizopts" data-qi="${qi}">
          ${q.options.map((o,oi)=>`<button type="button" class="qopt" data-oi="${oi}">${escapeHtml(o)}</button>`).join('')}
        </div>
        <div class="qexplain" id="explain-${qi}">${escapeHtml(q.explain)}</div>
      </div>
    `).join('');
    step.questions.forEach((q, qi) => {
      const group = list.querySelector(`.quizopts[data-qi="${qi}"]`);
      const already = quizState[qi];
      if(already !== null){
        group.querySelectorAll('.qopt').forEach((b,oi) => {
          b.disabled = true;
          if(oi === q.correct) b.classList.add('correct');
          if(oi === already && already !== q.correct) b.classList.add('wrong');
        });
        document.getElementById(`explain-${qi}`).classList.add('show');
      }
      group.querySelectorAll('.qopt').forEach((btn, oi) => {
        btn.addEventListener('click', () => {
          if(quizState[qi] !== null) return;
          quizState[qi] = oi;
          group.querySelectorAll('.qopt').forEach(b => b.disabled = true);
          btn.classList.add(oi === q.correct ? 'correct' : 'wrong');
          if(oi !== q.correct) group.children[q.correct].classList.add('correct');
          document.getElementById(`explain-${qi}`).classList.add('show');
          if(oi === q.correct) beep();
          updateScore();
        });
      });
    });
    updateScore();
  }

  function go(n){
    stopTimer();
    closePopover();
    idx = Math.max(0, Math.min(STEPS.length-1, n));
    render();
    document.getElementById('stage').scrollIntoView({block:'start'});
    window.scrollTo(0,0);
  }

  document.getElementById('prevBtn').addEventListener('click', () => go(idx-1));
  document.getElementById('nextBtn').addEventListener('click', () => {
    if(idx === STEPS.length-1){ window.location.href = 'index.html'; return; }
    go(idx+1);
  });

  render();
})();
</script>
</body>
</html>
